<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>社員管理</title>
  <!-- face-api.js (vladmandic fork: iOS Safari対応) -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <!-- SparkMD5: ブラウザでGASと同一のMD5を生成 -->
  <script src="https://cdn.jsdelivr.net/npm/spark-md5/spark-md5.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e; color: #eee;
      font-family: 'Helvetica Neue', sans-serif;
      height: 100dvh; display: flex; overflow: hidden;
      touch-action: manipulation;
    }

    /* ===== 左パネル ===== */
    .left { width: 45%; display: flex; flex-direction: column; border-right: 1px solid #333; }

    .datetime { text-align: center; background: #0f0f1a; border-bottom: 1px solid #333; padding: 5px 10px; flex-shrink: 0; }
    .datetime .date { font-size: 12px; color: #aaa; }
    .datetime .time { font-size: 24px; font-weight: bold; color: #00d4ff; letter-spacing: 0.1em; line-height: 1.2; }

    .tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid #333; }
    .tab {
      flex: 1; padding: 10px 0; text-align: center;
      font-size: 14px; font-weight: bold; letter-spacing: 0.08em;
      color: #666; background: #111; cursor: pointer;
      border: none; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; transition: all 0.2s;
    }
    .tab.active { color: #fff; background: #1a1a2e; border-bottom: 2px solid #00d4ff; }
    .tab:first-child { border-right: 1px solid #333; }

    .tab-content {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; padding: 10px 12px; gap: 10px; overflow: hidden;
    }
    .tab-content.active { display: flex; }

    .input-box { width: 100%; background: #0f0f1a; border: 2px solid #444; border-radius: 10px; padding: 8px 14px; text-align: right; }
    .input-box .label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .input-box .number { font-size: 30px; font-weight: bold; letter-spacing: 6px; color: #00d4ff; min-height: 36px; }
    .input-box .number.pin-mode { color: #ffab40; letter-spacing: 10px; }

    .cursor { display: inline-block; width: 2px; height: 28px; background: currentColor; vertical-align: middle; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .status-box {
      width: 100%; background: #0f0f1a; border: 2px solid #444;
      border-radius: 10px; padding: 8px 14px; text-align: center;
      min-height: 60px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .status-box .label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .status-box .name  { font-size: 22px; font-weight: bold; color: #fff; }
    .status-box .sub   { font-size: 11px; color: #aaa; margin-top: 4px; }
    .status-box.found      { border-color: #00e676; }
    .status-box.found .name{ color: #00e676; }
    .status-box.notfound   { border-color: #ff4d6d; }
    .status-box.notfound .name { color: #ff4d6d; font-size: 14px; }
    .status-box.loading .name  { color: #aaa; font-size: 14px; }
    .status-box.pin-state  { border-color: #ffab40; }
    .status-box.pin-state .name { color: #ffab40; font-size: 18px; }
    .status-box.registered { border-color: #888; }
    .status-box.registered .name { color: #888; font-size: 15px; }
    .status-box.success    { border-color: #00e676; background: rgba(0,230,118,0.07); }
    .status-box.success .name { color: #00e676; font-size: 15px; }
    /* 打刻専用 */
    .status-box.punch-wait  { border-color: #444; }
    .status-box.punch-wait .name { color: #666; font-size: 13px; }
    .status-box.punch-ok    { border-color: #00d4ff; background: rgba(0,212,255,0.07); }
    .status-box.punch-ok .name { color: #00d4ff; font-size: 20px; }
    .status-box.punch-fail  { border-color: #ff4d6d; background: rgba(255,77,109,0.07); }
    .status-box.punch-fail .name { color: #ff4d6d; font-size: 15px; }
    .status-box.face-check  { border-color: #ffab40; background: rgba(255,171,64,0.07); }
    .status-box.face-check .name { color: #ffab40; font-size: 14px; }

    /* モデル読み込み進捗 */
    #model-status {
      width: 100%; font-size: 10px; color: #555;
      text-align: center; padding: 2px 0;
    }

    .keypad-label { width: 100%; font-size: 11px; color: #888; text-align: center; letter-spacing: 0.05em; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; }
    .key {
      background: #2a2a4a; border: none; border-radius: 10px;
      color: #fff; font-size: 22px; font-weight: bold; padding: 13px 0;
      cursor: pointer; transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent; user-select: none;
      touch-action: manipulation;
    }
    .key:active            { background: #00d4ff; color: #000; transform: scale(0.94); }
    .key.pin-active:active { background: #ffab40; color: #000; }
    .key.del               { background: #3a2a2a; font-size: 18px; }
    .key.del:active        { background: #ff4d6d; }
    .key.clear             { background: #2a3a2a; font-size: 13px; }
    .key.clear:active      { background: #00e676; color: #000; }

    /* ===== 右パネル ===== */
    .right { width: 55%; display: flex; align-items: center; justify-content: center; background: #111; padding: 16px; }
    .camera-frame { width: 100%; height: 80%; position: relative; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid #333; }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    /* 顔認証用canvas（video上に重ねる・非表示） */
    #face-canvas { display: none; }
    .cam-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #555; font-size: 13px; }
    .cam-placeholder svg { opacity: 0.3; }
    .cam-placeholder.hidden { display: none; }
    #btn-cam { position: absolute; bottom: 12px; right: 12px; background: rgba(0,212,255,0.85); color: #000; border: none; border-radius: 24px; padding: 7px 16px; font-size: 13px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; z-index: 10; }
    #btn-cam.stop { background: rgba(255,77,109,0.85); color: #fff; }
    #cam-error { position: absolute; bottom: 50px; left: 8px; right: 8px; background: rgba(255,77,109,0.15); border: 1px solid #ff4d6d; border-radius: 8px; padding: 5px 10px; font-size: 11px; color: #ff4d6d; display: none; }
    #cam-error.visible { display: block; }
  </style>
</head>
<body>

<div class="left">
  <div class="datetime">
    <div class="date" id="dt-date">—</div>
    <div class="time" id="dt-time">--:--:--</div>
  </div>

  <div class="tabs">
    <button class="tab active"  id="tab-punch"    onclick="switchTab('punch')">打刻</button>
    <button class="tab"         id="tab-register" onclick="switchTab('register')">登録</button>
  </div>

  <!-- ===== 打刻タブ ===== -->
  <div class="tab-content active" id="content-punch">
    <div id="model-status">モデル読み込み中…</div>

    <div class="input-box">
      <div class="label">暗証番号（PIN）</div>
      <div class="number pin-mode" id="punch-num"><span class="cursor"></span></div>
    </div>

    <div class="status-box punch-wait" id="punch-status">
      <div class="label">ステータス</div>
      <div class="name" id="punch-msg">暗証番号を入力してください</div>
      <div class="sub"  id="punch-sub"></div>
    </div>

    <div class="keypad-label">6桁のPINを入力</div>

    <div class="keypad">
      <button class="key pin-active" data-tab="punch" data-val="1">1</button>
      <button class="key pin-active" data-tab="punch" data-val="2">2</button>
      <button class="key pin-active" data-tab="punch" data-val="3">3</button>
      <button class="key pin-active" data-tab="punch" data-val="4">4</button>
      <button class="key pin-active" data-tab="punch" data-val="5">5</button>
      <button class="key pin-active" data-tab="punch" data-val="6">6</button>
      <button class="key pin-active" data-tab="punch" data-val="7">7</button>
      <button class="key pin-active" data-tab="punch" data-val="8">8</button>
      <button class="key pin-active" data-tab="punch" data-val="9">9</button>
      <button class="key clear"      data-tab="punch" data-val="C">CLR</button>
      <button class="key pin-active" data-tab="punch" data-val="0">0</button>
      <button class="key del"        data-tab="punch" data-val="DEL">⌫</button>
    </div>
  </div>

  <!-- ===== 登録タブ ===== -->
  <div class="tab-content" id="content-register">
    <div class="input-box">
      <div class="label" id="reg-input-label">社員番号</div>
      <div class="number" id="reg-num"><span class="cursor"></span></div>
    </div>

    <div class="status-box" id="reg-status">
      <div class="label" id="reg-name-label">氏名</div>
      <div class="name"  id="reg-name">—</div>
      <div class="sub"   id="reg-sub"></div>
    </div>

    <div class="keypad-label" id="reg-keypad-label">社員番号を入力してください</div>

    <div class="keypad">
      <button class="key" data-tab="register" data-val="1">1</button>
      <button class="key" data-tab="register" data-val="2">2</button>
      <button class="key" data-tab="register" data-val="3">3</button>
      <button class="key" data-tab="register" data-val="4">4</button>
      <button class="key" data-tab="register" data-val="5">5</button>
      <button class="key" data-tab="register" data-val="6">6</button>
      <button class="key" data-tab="register" data-val="7">7</button>
      <button class="key" data-tab="register" data-val="8">8</button>
      <button class="key" data-tab="register" data-val="9">9</button>
      <button class="key clear"   data-tab="register" data-val="C">CLR</button>
      <button class="key"         data-tab="register" data-val="0">0</button>
      <button class="key del"     data-tab="register" data-val="DEL">⌫</button>
    </div>
  </div>
</div>

<!-- 右パネル -->
<div class="right">
  <div class="camera-frame">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="face-canvas"></canvas>
    <div class="cam-placeholder" id="cam-placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      カメラ未起動
    </div>
    <div id="cam-error"></div>
    <button id="btn-cam">📷 カメラ起動</button>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzKpqbE2T4HsodaQWJvxiyxUDMr1DmUxvC3PcSHlDR4WdCHBqKw2zLW_EhUdftOvqg/exec'; // ← GASデプロイURLに変更
  var MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

  // ── face-api モデル読み込み ──
  var modelsLoaded = false;
  var modelStatus  = document.getElementById('model-status');

  async function loadModels() {
    try {
      modelStatus.textContent = 'モデル読み込み中…';
      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      modelsLoaded = true;
      modelStatus.textContent = '✅ 顔認証 準備完了';
      setTimeout(function(){ modelStatus.textContent = ''; }, 2000);
    } catch(e) {
      modelStatus.textContent = '⚠️ モデル読み込み失敗: ' + e.message;
    }
  }
  loadModels();

  // ── 時計 ──
  function updateClock() {
    var now = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    var w   = ['日','月','火','水','木','金','土'][now.getDay()];
    document.getElementById('dt-date').textContent =
      now.getFullYear()+'年'+pad(now.getMonth()+1)+'月'+pad(now.getDate())+'日（'+w+'）';
    document.getElementById('dt-time').textContent =
      pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  updateClock(); setInterval(updateClock, 1000);

  // ── タブ切替 ──
  function switchTab(name) {
    ['punch','register'].forEach(function(t) {
      document.getElementById('tab-'+t).classList.toggle('active', t===name);
      document.getElementById('content-'+t).classList.toggle('active', t===name);
    });
    if (name==='punch')    resetPunch();
    if (name==='register') resetRegister();
  }

  // ============================================================
  // 打刻タブ
  // ============================================================
  var punchInput = '';
  var punchNumEl  = document.getElementById('punch-num');
  var punchStatus = document.getElementById('punch-status');
  var punchMsg    = document.getElementById('punch-msg');
  var punchSub    = document.getElementById('punch-sub');

  function resetPunch() {
    punchInput = '';
    punchNumEl.innerHTML      = '<span class="cursor"></span>';
    punchStatus.className     = 'status-box punch-wait';
    punchMsg.textContent      = '暗証番号を入力してください';
    punchSub.textContent      = '';
  }

  function handlePunchKey(v) {
    if (v==='C')         { punchInput = ''; }
    else if (v==='DEL')  { punchInput = punchInput.slice(0,-1); }
    else {
      if (punchInput.length >= 6) return;
      punchInput += v;
    }
    punchNumEl.innerHTML = '●'.repeat(punchInput.length) + '<span class="cursor"></span>';
    if (punchInput.length === 6) submitPunch();
  }

  // PIN入力完了 → GASでPIN照合 → 顔認証
  async function submitPunch() {
    if (!modelsLoaded) {
      punchStatus.className = 'status-box punch-fail';
      punchMsg.textContent  = 'モデル読み込み中です…';
      punchSub.textContent  = '少し待ってから再試行してください';
      setTimeout(resetPunch, 2500); return;
    }

    punchStatus.className = 'status-box loading';
    punchMsg.textContent  = 'PIN照合中…';
    punchSub.textContent  = '';

    // ① BASE36ハッシュ化（ブラウザ側）
    var pinHash = base36HashBrowser(punchInput);

    // ② GASにPINハッシュを送って社員情報＋登録写真取得
    var data;
    try {
      var res = await fetch(GAS_URL + '?action=verify&pin=' + encodeURIComponent(pinHash));
      data = await res.json();
    } catch(e) {
      punchStatus.className = 'status-box punch-fail';
      punchMsg.textContent  = '通信エラー';
      punchSub.textContent  = e.message;
      setTimeout(resetPunch, 3000); return;
    }

    if (!data.success) {
      punchStatus.className = 'status-box punch-fail';
      punchMsg.textContent  = 'PIN不一致';
      punchSub.textContent  = data.message || '';
      setTimeout(resetPunch, 2500); return;
    }

    // ③ 顔認証
    punchStatus.className = 'status-box face-check';
    punchMsg.textContent  = '顔認証中…';
    punchSub.textContent  = data.name;

    if (!data.image) {
      // 登録写真なし → PINのみで打刻成功
      punchStatus.className = 'status-box punch-ok';
      punchMsg.textContent  = data.name;
      punchSub.textContent  = '✅ 打刻完了（写真未登録）';
      setTimeout(resetPunch, 3000); return;
    }

    var faceMatch = await compareFaces(data.image);
    if (faceMatch === null) {
      punchStatus.className = 'status-box punch-fail';
      punchMsg.textContent  = '顔を検出できません';
      punchSub.textContent  = 'カメラに顔を向けてください';
      setTimeout(resetPunch, 3000); return;
    }
    if (faceMatch) {
      punchStatus.className = 'status-box punch-ok';
      punchMsg.textContent  = data.name;
      punchSub.textContent  = '✅ 打刻完了';
      setTimeout(resetPunch, 3000);
    } else {
      punchStatus.className = 'status-box punch-fail';
      punchMsg.textContent  = '顔認証失敗';
      punchSub.textContent  = '登録者と一致しません';
      setTimeout(resetPunch, 3000);
    }
  }

  // ── 顔照合 ──
  // 登録写真(base64)とカメラ現在フレームを比較
  // 戻り値: true=一致, false=不一致, null=顔未検出
  async function compareFaces(registeredImageDataUrl) {
    try {
      // 登録写真のdescriptor取得
      var regImg = await faceapi.fetchImage(registeredImageDataUrl);
      var regDetection = await faceapi
        .detectSingleFace(regImg)
        .withFaceLandmarks()
        .withFaceDescriptor();
      if (!regDetection) return null;

      // カメラ現フレームをcanvasに描画してdescriptor取得
      var canvas = document.getElementById('face-canvas');
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;
      var cx = canvas.getContext('2d');
      cx.save(); cx.translate(canvas.width,0); cx.scale(-1,1);
      cx.drawImage(video, 0, 0, canvas.width, canvas.height);
      cx.restore();

      var liveDetection = await faceapi
        .detectSingleFace(canvas)
        .withFaceLandmarks()
        .withFaceDescriptor();
      if (!liveDetection) return null;

      // ユークリッド距離で比較（0.5以下で同一人物と判定）
      var distance = faceapi.euclideanDistance(
        regDetection.descriptor,
        liveDetection.descriptor
      );
      return distance < 0.5;
    } catch(e) {
      return null;
    }
  }

  // ── BASE36ハッシュ（ブラウザ用・SparkMD5使用）──
  // SparkMD5はGASのUtilities.computeDigest(MD5)と同一結果を返す
  function base36HashBrowser(input) {
    var hexString = SparkMD5.hash(input); // 小文字hex
    var bigVal = BigInt('0x' + hexString);
    return bigVal.toString(36).slice(0,8).toUpperCase();
  }

  // ============================================================
  // 登録タブ
  // ============================================================
  var regMode='emp', regEmpInput='', regPinInput='', regCurrentEmpNo='', regCurrentName='';
  var regNumEl      = document.getElementById('reg-num');
  var regNameEl     = document.getElementById('reg-name');
  var regSubEl      = document.getElementById('reg-sub');
  var regStatus     = document.getElementById('reg-status');
  var regNameLabel  = document.getElementById('reg-name-label');
  var regInputLabel = document.getElementById('reg-input-label');
  var regKeyLabel   = document.getElementById('reg-keypad-label');

  function resetRegister() {
    regMode='emp'; regEmpInput=''; regPinInput=''; regCurrentEmpNo=''; regCurrentName='';
    regInputLabel.textContent='社員番号'; regNumEl.className='number';
    regNumEl.innerHTML='<span class="cursor"></span>';
    regStatus.className='status-box'; regNameLabel.textContent='氏名';
    regNameEl.textContent='—'; regSubEl.textContent='';
    regKeyLabel.textContent='社員番号を入力してください';
    document.querySelectorAll('#content-register .key').forEach(function(k){ k.classList.remove('pin-active'); });
  }

  function handleRegisterKey(v) {
    if (regMode==='emp') handleRegEmpKey(v); else handleRegPinKey(v);
  }

  function handleRegEmpKey(v) {
    if (v==='C') regEmpInput='';
    else if (v==='DEL') regEmpInput=regEmpInput.slice(0,-1);
    else { if(regEmpInput.length>=6) return; regEmpInput+=v; }
    regNumEl.className='number';
    regNumEl.innerHTML=regEmpInput ? regEmpInput+'<span class="cursor"></span>' : '<span class="cursor"></span>';
    if (regEmpInput.length<6){ regStatus.className='status-box'; regNameEl.textContent='—'; regSubEl.textContent=''; }
    if (regEmpInput.length===6) searchEmployee();
  }

  function searchEmployee() {
    regStatus.className='status-box loading'; regNameEl.textContent='検索中…'; regSubEl.textContent='';
    fetch(GAS_URL+'?empNo='+regEmpInput)
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (!data.success) { regStatus.className='status-box notfound'; regNameEl.textContent='該当者なし'; regSubEl.textContent=''; return; }
        regCurrentEmpNo=regEmpInput; regCurrentName=data.name;
        if (data.hasPin) {
          regStatus.className='status-box registered'; regNameEl.textContent=data.name; regSubEl.textContent='✅ 暗証番号登録済み';
        } else {
          regStatus.className='status-box found'; regNameEl.textContent=data.name; regSubEl.textContent='';
          setTimeout(switchToRegPinMode, 600);
        }
      })
      .catch(function(){ regStatus.className='status-box notfound'; regNameEl.textContent='通信エラー'; regSubEl.textContent=''; });
  }

  function switchToRegPinMode() {
    regMode='pin'; regPinInput='';
    regInputLabel.textContent='暗証番号（PIN）'; regKeyLabel.textContent='6桁の暗証番号を入力してください';
    regStatus.className='status-box pin-state'; regNameEl.textContent=regCurrentName; regSubEl.textContent='🔑 暗証番号を設定してください';
    regNumEl.className='number pin-mode'; regNumEl.innerHTML='<span class="cursor"></span>';
    document.querySelectorAll('#content-register .key').forEach(function(k){ k.classList.add('pin-active'); });
  }

  function handleRegPinKey(v) {
    if (v==='C') regPinInput='';
    else if (v==='DEL') regPinInput=regPinInput.slice(0,-1);
    else { if(regPinInput.length>=6) return; regPinInput+=v; }
    regNumEl.innerHTML='●'.repeat(regPinInput.length)+'<span class="cursor"></span>';
    if (regPinInput.length===6) registerPin();
  }

  function captureImage() {
    if (!stream) return null;
    var c=document.createElement('canvas');
    var vw=video.videoWidth||640, vh=video.videoHeight||480;
    c.width=vw; c.height=vh;
    var cx=c.getContext('2d');
    cx.save(); cx.translate(vw,0); cx.scale(-1,1); cx.drawImage(video,0,0,vw,vh); cx.restore();
    return c.toDataURL('image/jpeg',0.85);
  }

  function registerPin() {
    regStatus.className='status-box loading'; regNameEl.textContent='登録中…'; regSubEl.textContent='';
    var imageData=captureImage();
    var params=new URLSearchParams();
    params.append('action','register'); params.append('empNo',regCurrentEmpNo);
    params.append('pin',regPinInput); if(imageData) params.append('image',imageData);
    fetch(GAS_URL,{method:'POST',body:params})
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (data.success) {
          regStatus.className='status-box success'; regNameEl.textContent=regCurrentName;
          regSubEl.textContent='✅ 暗証番号を登録しました'; regNumEl.innerHTML='●●●●●●';
          setTimeout(resetRegister,3000);
        } else {
          regStatus.className='status-box notfound'; regNameEl.textContent=data.message||'登録失敗'; regSubEl.textContent='';
          setTimeout(resetRegister,2500);
        }
      })
      .catch(function(){ regStatus.className='status-box notfound'; regNameEl.textContent='通信エラー'; regSubEl.textContent=''; setTimeout(resetRegister,2500); });
  }

  // ── テンキー共通 ──
  document.querySelectorAll('.key').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tab=this.dataset.tab, v=this.dataset.val;
      if (tab==='punch')    handlePunchKey(v);
      if (tab==='register') handleRegisterKey(v);
    });
  });

  // ── カメラ ──
  var stream=null;
  var video=document.getElementById('video');
  var placeholder=document.getElementById('cam-placeholder');
  var btnCam=document.getElementById('btn-cam');
  var camError=document.getElementById('cam-error');

  btnCam.addEventListener('click', function(){ stream ? stopCamera() : startCamera(); });

  function startCamera() {
    camError.classList.remove('visible');
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false})
      .then(function(s){ stream=s; video.srcObject=s; placeholder.classList.add('hidden'); btnCam.textContent='⏹ 停止'; btnCam.classList.add('stop'); })
      .catch(function(err){ camError.textContent='カメラエラー: '+err.message; camError.classList.add('visible'); });
  }
  function stopCamera() {
    if(stream){stream.getTracks().forEach(function(t){t.stop();}); stream=null;}
    video.srcObject=null; placeholder.classList.remove('hidden');
    btnCam.textContent='📷 カメラ起動'; btnCam.classList.remove('stop');
  }
</script>
</body>
</html>
