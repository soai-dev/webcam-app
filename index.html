<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>社員管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Helvetica Neue', sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* ===== 左パネル ===== */
    .left {
      width: 45%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }

    /* ── 日付・時刻 ── */
    .datetime {
      text-align: center;
      background: #0f0f1a;
      border-bottom: 1px solid #333;
      padding: 5px 10px;
      flex-shrink: 0;
    }
    .datetime .date { font-size: 12px; color: #aaa; }
    .datetime .time { font-size: 24px; font-weight: bold; color: #00d4ff; letter-spacing: 0.1em; line-height: 1.2; }

    /* ── タブ ── */
    .tabs {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid #333;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #666;
      background: #111;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #fff;
      background: #1a1a2e;
      border-bottom: 2px solid #00d4ff;
    }
    .tab:first-child { border-right: 1px solid #333; }

    /* ── タブコンテンツ ── */
    .tab-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 10px 12px;
      gap: 10px;
      overflow: hidden;
    }
    .tab-content.active { display: flex; }

    /* ── 入力表示ボックス ── */
    .input-box {
      width: 100%;
      background: #0f0f1a;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 8px 14px;
      text-align: right;
    }
    .input-box .label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .input-box .number {
      font-size: 30px; font-weight: bold;
      letter-spacing: 6px; color: #00d4ff; min-height: 36px;
    }
    .input-box .number.pin-mode { color: #ffab40; letter-spacing: 10px; }

    .cursor {
      display: inline-block; width: 2px; height: 28px;
      background: currentColor; vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── ステータスボックス ── */
    .status-box {
      width: 100%;
      background: #0f0f1a;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 8px 14px;
      text-align: center;
      min-height: 60px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .status-box .label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .status-box .name  { font-size: 22px; font-weight: bold; color: #fff; }
    .status-box .sub   { font-size: 11px; color: #aaa; margin-top: 4px; }
    .status-box.found     { border-color: #00e676; }
    .status-box.found .name { color: #00e676; }
    .status-box.notfound  { border-color: #ff4d6d; }
    .status-box.notfound .name { color: #ff4d6d; font-size: 14px; }
    .status-box.loading .name  { color: #aaa; font-size: 14px; }
    .status-box.pin-state  { border-color: #ffab40; }
    .status-box.pin-state .name { color: #ffab40; font-size: 18px; }
    .status-box.registered { border-color: #888; }
    .status-box.registered .name { color: #888; font-size: 15px; }
    .status-box.success    { border-color: #00e676; background: rgba(0,230,118,0.07); }
    .status-box.success .name { color: #00e676; font-size: 15px; }
    /* 打刻タブ専用 */
    .status-box.punch-wait  { border-color: #444; }
    .status-box.punch-wait .name { color: #666; font-size: 13px; }
    .status-box.punch-ok    { border-color: #00d4ff; background: rgba(0,212,255,0.07); }
    .status-box.punch-ok .name { color: #00d4ff; font-size: 18px; }

    /* ── テンキーラベル ── */
    .keypad-label {
      width: 100%; font-size: 11px; color: #888;
      text-align: center; letter-spacing: 0.05em;
    }

    /* ── テンキー ── */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      width: 100%;
    }
    .key {
      background: #2a2a4a;
      border: none; border-radius: 10px;
      color: #fff; font-size: 22px; font-weight: bold;
      padding: 13px 0; cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    .key:active            { background: #00d4ff; color: #000; transform: scale(0.94); }
    .key.pin-active:active { background: #ffab40; color: #000; }
    .key.punch-active:active { background: #00d4ff; color: #000; }
    .key.del               { background: #3a2a2a; font-size: 18px; }
    .key.del:active        { background: #ff4d6d; }
    .key.clear             { background: #2a3a2a; font-size: 13px; }
    .key.clear:active      { background: #00e676; color: #000; }

    /* ===== 右パネル（カメラ） ===== */
    .right {
      width: 55%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      padding: 16px;
    }
    .camera-frame {
      width: 100%; height: 80%;
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #333;
    }
    #video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    .cam-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      justify-content: center; flex-direction: column;
      gap: 8px; color: #555; font-size: 13px;
    }
    .cam-placeholder svg { opacity: 0.3; }
    .cam-placeholder.hidden { display: none; }
    #btn-cam {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(0,212,255,0.85); color: #000;
      border: none; border-radius: 24px;
      padding: 7px 16px; font-size: 13px; font-weight: bold;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; z-index: 10;
    }
    #btn-cam.stop { background: rgba(255,77,109,0.85); color: #fff; }
    #cam-error {
      position: absolute; bottom: 50px; left: 8px; right: 8px;
      background: rgba(255,77,109,0.15); border: 1px solid #ff4d6d;
      border-radius: 8px; padding: 5px 10px;
      font-size: 11px; color: #ff4d6d; display: none;
    }
    #cam-error.visible { display: block; }
  </style>
</head>
<body>

<!-- 左パネル -->
<div class="left">

  <!-- 日時 -->
  <div class="datetime">
    <div class="date" id="dt-date">—</div>
    <div class="time" id="dt-time">--:--:--</div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tab active" id="tab-punch"  onclick="switchTab('punch')">打刻</button>
    <button class="tab"        id="tab-register" onclick="switchTab('register')">登録</button>
  </div>

  <!-- ===== 打刻タブ ===== -->
  <div class="tab-content active" id="content-punch">

    <div class="input-box">
      <div class="label">暗証番号（PIN）</div>
      <div class="number pin-mode" id="punch-num"><span class="cursor"></span></div>
    </div>

    <div class="status-box punch-wait" id="punch-status">
      <div class="label">ステータス</div>
      <div class="name" id="punch-msg">暗証番号を入力してください</div>
      <div class="sub"  id="punch-sub"></div>
    </div>

    <div class="keypad-label" id="punch-keypad-label">6桁のPINを入力</div>

    <div class="keypad" id="keypad-punch">
      <button class="key punch-active" data-tab="punch" data-val="1">1</button>
      <button class="key punch-active" data-tab="punch" data-val="2">2</button>
      <button class="key punch-active" data-tab="punch" data-val="3">3</button>
      <button class="key punch-active" data-tab="punch" data-val="4">4</button>
      <button class="key punch-active" data-tab="punch" data-val="5">5</button>
      <button class="key punch-active" data-tab="punch" data-val="6">6</button>
      <button class="key punch-active" data-tab="punch" data-val="7">7</button>
      <button class="key punch-active" data-tab="punch" data-val="8">8</button>
      <button class="key punch-active" data-tab="punch" data-val="9">9</button>
      <button class="key clear"        data-tab="punch" data-val="C">CLR</button>
      <button class="key punch-active" data-tab="punch" data-val="0">0</button>
      <button class="key del"          data-tab="punch" data-val="DEL">⌫</button>
    </div>

  </div>

  <!-- ===== 登録タブ ===== -->
  <div class="tab-content" id="content-register">

    <div class="input-box">
      <div class="label" id="reg-input-label">社員番号</div>
      <div class="number" id="reg-num"><span class="cursor"></span></div>
    </div>

    <div class="status-box" id="reg-status">
      <div class="label" id="reg-name-label">氏名</div>
      <div class="name"  id="reg-name">—</div>
      <div class="sub"   id="reg-sub"></div>
    </div>

    <div class="keypad-label" id="reg-keypad-label">社員番号を入力してください</div>

    <div class="keypad" id="keypad-register">
      <button class="key" data-tab="register" data-val="1">1</button>
      <button class="key" data-tab="register" data-val="2">2</button>
      <button class="key" data-tab="register" data-val="3">3</button>
      <button class="key" data-tab="register" data-val="4">4</button>
      <button class="key" data-tab="register" data-val="5">5</button>
      <button class="key" data-tab="register" data-val="6">6</button>
      <button class="key" data-tab="register" data-val="7">7</button>
      <button class="key" data-tab="register" data-val="8">8</button>
      <button class="key" data-tab="register" data-val="9">9</button>
      <button class="key clear"   data-tab="register" data-val="C">CLR</button>
      <button class="key"         data-tab="register" data-val="0">0</button>
      <button class="key del"     data-tab="register" data-val="DEL">⌫</button>
    </div>

  </div>

</div>

<!-- 右パネル（カメラ）-->
<div class="right">
  <div class="camera-frame">
    <video id="video" autoplay playsinline muted></video>
    <div class="cam-placeholder" id="cam-placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      カメラ未起動
    </div>
    <div id="cam-error"></div>
    <button id="btn-cam">📷 カメラ起動</button>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyBm0BM7pJ0qwJ4YjAUBbHrbL0yeUVFVhO5BCZ4Ufl1EGg88WgSbbpoVmQv_0RPS26-/exec'; // ← GASデプロイURLに変更

  // ── 時計 ──
  function updateClock() {
    var now   = new Date();
    var y     = now.getFullYear();
    var mo    = String(now.getMonth()+1).padStart(2,'0');
    var d     = String(now.getDate()).padStart(2,'0');
    var w     = ['日','月','火','水','木','金','土'][now.getDay()];
    var h     = String(now.getHours()).padStart(2,'0');
    var mi    = String(now.getMinutes()).padStart(2,'0');
    var s     = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('dt-date').textContent = y+'年'+mo+'月'+d+'日（'+w+'）';
    document.getElementById('dt-time').textContent = h+':'+mi+':'+s;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── タブ切替 ──
  function switchTab(name) {
    ['punch','register'].forEach(function(t) {
      document.getElementById('tab-'+t).classList.toggle('active', t===name);
      document.getElementById('content-'+t).classList.toggle('active', t===name);
    });
    // タブ切替時にそれぞれリセット
    if (name === 'punch')    resetPunch();
    if (name === 'register') resetRegister();
  }

  // ============================================================
  // 打刻タブ
  // ============================================================
  var punchInput = '';

  var punchNumEl    = document.getElementById('punch-num');
  var punchStatus   = document.getElementById('punch-status');
  var punchMsg      = document.getElementById('punch-msg');
  var punchSub      = document.getElementById('punch-sub');

  function resetPunch() {
    punchInput = '';
    punchNumEl.className = 'number pin-mode';
    punchNumEl.innerHTML = '<span class="cursor"></span>';
    punchStatus.className = 'status-box punch-wait';
    punchMsg.textContent  = '暗証番号を入力してください';
    punchSub.textContent  = '';
  }

  function handlePunchKey(v) {
    if (v === 'C') {
      punchInput = '';
    } else if (v === 'DEL') {
      punchInput = punchInput.slice(0,-1);
    } else {
      if (punchInput.length >= 6) return;
      punchInput += v;
    }
    punchNumEl.innerHTML = '●'.repeat(punchInput.length) + '<span class="cursor"></span>';
    if (punchInput.length === 6) submitPunch();
  }

  function submitPunch() {
    // ※テスト版：入力完了のみ表示、GAS連携は未実装
    punchStatus.className = 'status-box punch-ok';
    punchMsg.textContent  = '✅ 入力完了（テスト）';
    punchSub.textContent  = 'PIN: ' + '●'.repeat(6);
    setTimeout(resetPunch, 2000);
  }

  // ============================================================
  // 登録タブ
  // ============================================================
  var regMode       = 'emp';  // 'emp' or 'pin'
  var regEmpInput   = '';
  var regPinInput   = '';
  var regCurrentEmpNo = '';
  var regCurrentName  = '';

  var regNumEl      = document.getElementById('reg-num');
  var regNameEl     = document.getElementById('reg-name');
  var regSubEl      = document.getElementById('reg-sub');
  var regStatus     = document.getElementById('reg-status');
  var regNameLabel  = document.getElementById('reg-name-label');
  var regInputLabel = document.getElementById('reg-input-label');
  var regKeyLabel   = document.getElementById('reg-keypad-label');

  function resetRegister() {
    regMode       = 'emp';
    regEmpInput   = '';
    regPinInput   = '';
    regCurrentEmpNo = '';
    regCurrentName  = '';
    regInputLabel.textContent = '社員番号';
    regNumEl.className        = 'number';
    regNumEl.innerHTML        = '<span class="cursor"></span>';
    regStatus.className       = 'status-box';
    regNameLabel.textContent  = '氏名';
    regNameEl.textContent     = '—';
    regSubEl.textContent      = '';
    regKeyLabel.textContent   = '社員番号を入力してください';
    setRegKeyColor('emp');
  }

  function handleRegisterKey(v) {
    if (regMode === 'emp') handleRegEmpKey(v);
    else                   handleRegPinKey(v);
  }

  function handleRegEmpKey(v) {
    if (v === 'C')        { regEmpInput = ''; }
    else if (v === 'DEL') { regEmpInput = regEmpInput.slice(0,-1); }
    else {
      if (regEmpInput.length >= 6) return;
      regEmpInput += v;
    }
    regNumEl.className = 'number';
    regNumEl.innerHTML = regEmpInput
      ? regEmpInput + '<span class="cursor"></span>'
      : '<span class="cursor"></span>';
    if (regEmpInput.length < 6) {
      regStatus.className  = 'status-box';
      regNameEl.textContent = '—';
      regSubEl.textContent  = '';
    }
    if (regEmpInput.length === 6) searchEmployee();
  }

  function searchEmployee() {
    regStatus.className   = 'status-box loading';
    regNameEl.textContent = '検索中…';
    regSubEl.textContent  = '';

    fetch(GAS_URL + '?empNo=' + regEmpInput)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data.success) {
          regStatus.className   = 'status-box notfound';
          regNameEl.textContent = '該当者なし';
          regSubEl.textContent  = '';
          return;
        }
        regCurrentEmpNo = regEmpInput;
        regCurrentName  = data.name;
        if (data.hasPin) {
          regStatus.className   = 'status-box registered';
          regNameEl.textContent = data.name;
          regSubEl.textContent  = '✅ 暗証番号登録済み';
        } else {
          regStatus.className   = 'status-box found';
          regNameEl.textContent = data.name;
          regSubEl.textContent  = '';
          setTimeout(switchToRegPinMode, 600);
        }
      })
      .catch(function() {
        regStatus.className   = 'status-box notfound';
        regNameEl.textContent = '通信エラー';
        regSubEl.textContent  = '';
      });
  }

  function switchToRegPinMode() {
    regMode    = 'pin';
    regPinInput = '';
    regInputLabel.textContent = '暗証番号（PIN）';
    regKeyLabel.textContent   = '6桁の暗証番号を入力してください';
    regStatus.className       = 'status-box pin-state';
    regNameEl.textContent     = regCurrentName;
    regSubEl.textContent      = '🔑 暗証番号を設定してください';
    regNumEl.className        = 'number pin-mode';
    regNumEl.innerHTML        = '<span class="cursor"></span>';
    setRegKeyColor('pin');
  }

  function handleRegPinKey(v) {
    if (v === 'C')        { regPinInput = ''; }
    else if (v === 'DEL') { regPinInput = regPinInput.slice(0,-1); }
    else {
      if (regPinInput.length >= 6) return;
      regPinInput += v;
    }
    regNumEl.className = 'number pin-mode';
    regNumEl.innerHTML = '●'.repeat(regPinInput.length) + '<span class="cursor"></span>';
    if (regPinInput.length === 6) registerPin();
  }

  function captureImage() {
    if (!stream) return null;
    var c = document.createElement('canvas');
    var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    c.width = vw; c.height = vh;
    var cx = c.getContext('2d');
    cx.save(); cx.translate(vw,0); cx.scale(-1,1);
    cx.drawImage(video,0,0,vw,vh); cx.restore();
    return c.toDataURL('image/jpeg', 0.85);
  }

  function registerPin() {
    regStatus.className   = 'status-box loading';
    regNameEl.textContent = '登録中…';
    regSubEl.textContent  = '';

    var imageData = captureImage();
    var params = new URLSearchParams();
    params.append('action', 'register');
    params.append('empNo',  regCurrentEmpNo);
    params.append('pin',    regPinInput);
    if (imageData) params.append('image', imageData);

    fetch(GAS_URL, { method: 'POST', body: params })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.success) {
          regStatus.className   = 'status-box success';
          regNameEl.textContent = regCurrentName;
          regSubEl.textContent  = '✅ 暗証番号を登録しました';
          regNumEl.innerHTML    = '●●●●●●';
          setTimeout(resetRegister, 3000);
        } else {
          regStatus.className   = 'status-box notfound';
          regNameEl.textContent = data.message || '登録失敗';
          regSubEl.textContent  = '';
          setTimeout(resetRegister, 2500);
        }
      })
      .catch(function() {
        regStatus.className   = 'status-box notfound';
        regNameEl.textContent = '通信エラー';
        regSubEl.textContent  = '';
        setTimeout(resetRegister, 2500);
      });
  }

  function setRegKeyColor(m) {
    document.querySelectorAll('#keypad-register .key').forEach(function(k) {
      if (m === 'pin') k.classList.add('pin-active');
      else             k.classList.remove('pin-active');
    });
  }

  // ── テンキー共通ハンドラ ──
  document.querySelectorAll('.key').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tab = this.dataset.tab;
      var v   = this.dataset.val;
      if (tab === 'punch')    handlePunchKey(v);
      if (tab === 'register') handleRegisterKey(v);
    });
  });

  // ── カメラ ──
  var stream      = null;
  var video       = document.getElementById('video');
  var placeholder = document.getElementById('cam-placeholder');
  var btnCam      = document.getElementById('btn-cam');
  var camError    = document.getElementById('cam-error');

  btnCam.addEventListener('click', function() {
    stream ? stopCamera() : startCamera();
  });

  function startCamera() {
    camError.classList.remove('visible');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(function(s) {
      stream = s; video.srcObject = s;
      placeholder.classList.add('hidden');
      btnCam.textContent = '⏹ 停止';
      btnCam.classList.add('stop');
    }).catch(function(err) {
      camError.textContent = 'カメラエラー: ' + err.message;
      camError.classList.add('visible');
    });
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    video.srcObject = null;
    placeholder.classList.remove('hidden');
    btnCam.textContent = '📷 カメラ起動';
    btnCam.classList.remove('stop');
  }
</script>
</body>
</html>
